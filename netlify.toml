[build]
  publish = "public"

# Handle clean URLs
[[redirects]]
  from = "/sentiment"
  to = "/sentiment.html"
  status = 200

[[redirects]]
  from = "/fakenews"
  to = "/fakenews.html"
  status = 200

[[redirects]]
  from = "/pipeline"
  to = "/pipeline.html"
  status = 200

# Custom headers for performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
